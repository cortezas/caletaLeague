# Cron de La Caleta League.
#
# POR QUE AQUI Y NO SOLO EN VERCEL
# El plan Hobby de Vercel permite un unico cron y como mucho una vez al dia.
# Eso vale para traerse los resultados, pero no para los avisos: el aviso es
# "una hora antes del cierre", y con una pasada diaria la mitad de la peña se
# entera cuando el partido ya ha empezado. GitHub Actions no tiene esa limitacion.
#
# El cron de Vercel (vercel.json) se queda como red de seguridad: si esto se
# cae o alguien lo desactiva, los resultados siguen entrando una vez al dia.
#
# HACE FALTA UN SECRETO EN EL REPOSITORIO
#   Settings > Secrets and variables > Actions > New repository secret
#   Nombre: CRON_SECRET
#   Valor:  el mismo que tiene la variable CRON_SECRET en Vercel
# Sin el, los dos pasos fallan con 401 y se ve en la pestaña Actions.

name: Cron

on:
  schedule:
    # Avisos y alineaciones: cada 15 minutos. GitHub no garantiza puntualidad al
    # minuto y puede retrasarse en horas de mucha carga; es aceptable para un
    # aviso con una hora de antelacion y para unas alineaciones que se piden
    # durante los 90 minutos previos al partido. No lo seria para sellar
    # pronosticos, pero de eso se encarga la base de datos con kickoff_at.
    - cron: '*/15 * * * *'
    # Ingesta: una vez por hora. El calendario no cambia cada cuarto de hora y
    # la API gratuita solo admite 10 peticiones por minuto.
    - cron: '7 * * * *'
  # Para poder lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Si una pasada se alarga, que no se solapen dos.
concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://caleta-league.vercel.app
    steps:
      - name: Avisos antes del cierre
        run: |
          code=$(curl -sS -o /tmp/push.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60 "$BASE/api/push/dispatch")
          echo "HTTP $code"; cat /tmp/push.json || true; echo
          # 503 = sin claves VAPID configuradas. No es un fallo del cron.
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then exit 1; fi

      - name: Alineaciones (cada 15 minutos)
        # POR QUE ESTE PASO EXISTE
        # Las alineaciones oficiales salen sobre una HORA antes del pitido, pero
        # no a una hora clavada: para un partido de las 19:30 pueden aparecer a
        # las 18:35 o a las 19:15. `syncLineups` solo pide las de lo que arranca
        # en los proximos 90 minutos, asi que con la ingesta SOLO horaria un
        # partido de las 19:30 tenia dos intentos (18:07 y 19:07) y una
        # alineacion publicada a las 19:15 no se llegaba a pedir nunca.
        #
        # CUANTOS INTENTOS DA ESTO DE VERDAD (medido, no supuesto)
        # `*/15` NO significa cada 15 minutos. Sobre las 58 pasadas programadas
        # del 11 al 13 de agosto de 2026, GitHub disparo una cada 42 minutos de
        # media (mediana 35, minimo 1, MAXIMO 156). En la ventana de 90 minutos
        # eso son 2 o 3 intentos tipicos, no seis, y un hueco malo puede
        # saltarsela entera. Sigue siendo mejor que los 2 fijos de antes, pero no
        # es una garantia: si el sabado la peña ve "aun no disponibles" con el
        # partido a punto de empezar, la causa mas probable es esta, no un fallo
        # de la app. Se comprueba en la pestaña Actions.
        #
        # POR QUE NO GASTA CUOTA
        # `squads=0` se salta las plantillas (1 peticion a football-data que no
        # cambia de un cuarto de hora a otro) y `events=0` deja los goleadores
        # para la pasada horaria, que es la que tiene presupuesto para ellos.
        # Queda el paso 1 (1 peticion a football-data por pasada, contra un
        # limite de 10 por MINUTO) y el paso 4, que FUERA de la ventana de 90
        # minutos sale antes de llamar a nadie: cero peticiones de Highlightly.
        # Solo gasta los dias de partido y solo en la hora previa.
        if: ${{ github.event.schedule == '*/15 * * * *' }}
        run: |
          code=$(curl -sS -o /tmp/lineups.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 "$BASE/api/sync?squads=0&events=0")
          echo "HTTP $code"; head -c 600 /tmp/lineups.json || true; echo
          [ "$code" = "200" ]

      - name: Ingesta de partidos y resultados
        # Solo en la pasada horaria (o a mano). La de cada 15 minutos hace su
        # propia llamada recortada (paso de arriba); esta es la completa, con
        # plantillas y goleadores.
        if: ${{ github.event.schedule == '7 * * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          code=$(curl -sS -o /tmp/sync.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 "$BASE/api/sync")
          echo "HTTP $code"; head -c 600 /tmp/sync.json || true; echo
          [ "$code" = "200" ]
